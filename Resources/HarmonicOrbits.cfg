HARMONIC_ORBITS_SETTINGS
{
    enabled = true

    // Log every loaded model's coefficients and its elements at UT 0.
    dumpModels = true

    // Re-solve encounters with the target osculating at the crossing time.
    reosculateEncounters = true

    // Behaviour outside the fitted 1951-2051 window.
    //   continue - keep evaluating the harmonics; tested good to 2100 and likely beyond
    //   clamp    - hold the elements at the window edge, mean motion only (stock behaviour)
    outsideWindow = continue

    // A body is driven only if it is listed here AND has a pack in Bodies/.
    // Position RMS over 1951-2051, against the 10% of body radius target:
    //
    //   Mercury    101 km  /  244 km      Venus   180 km  /  605 km
    //   Earth      573 km  /  637 km      Moon     38 km  /  174 km
    //   Mars     1,299 km  /  338 km      3.8x over -- accepted, see below
    //
    // Mars is the one body shipped over its target. It has the strictest target
    // of any body in the set (radius/a is the smallest, so 10% of its radius is
    // a 3-4x tighter angle than for the other planets), and it is tugged hardest
    // by Jupiter. Its error is still 448x smaller than the static orbit Sol
    // ships, so driving it is a large improvement over not driving it.
    BODY
    {
        name = Mercury
        enabled = true
    }
    BODY
    {
        name = Venus
        enabled = true
    }
    BODY
    {
        name = Earth
        enabled = true
    }
    BODY
    {
        name = Moon
        enabled = true
    }
    BODY
    {
        name = Mars
        enabled = true
    }
}
